[project]
name = "hindi-voice-studio"
version = "0.1.0"
description = "A local voice-cloning studio for Hindi, Hinglish, and English."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Vineet Pandey" }]
dependencies = [
    "gradio==6.8.0",
    "numpy>=1.24,<2; python_version < '3.13'",
    "numpy>=2; python_version >= '3.13'",
    "librosa==0.11.0",
    "python-dotenv>=1.0.1,<2",
    "soundfile>=0.12.1,<1",
]

[project.optional-dependencies]
local = [
    "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2",
]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
hindi-voice-studio = "hindi_voice_studio.app:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindi_voice_studio"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# Chatterbox specifies Perth's moving master branch; freeze that dependency too.
override-dependencies = [
    "resemble-perth @ git+https://github.com/resemble-ai/Perth.git@ff1c8ac55a976971245cdd53c18d6131ca00d993",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
